<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>VELOCE | Luxury & Performance Footwear</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#09090b" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background-color: #09090b;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        text-align: center;
      }
      .logo {
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 0.15em;
        color: #ffffff;
      }
      .logo span {
        color: #f83b3b;
      }
      .tagline {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: #71717a;
      }
      .bars-loader {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 28px;
      }
      .bar {
        width: 4px;
        height: 100%;
        background-color: #f83b3b;
        border-radius: 9999px;
        animation: barPulse 1.2s ease-in-out infinite;
      }
      .bar:nth-child(1) { animation-delay: 0.0s; }
      .bar:nth-child(2) { animation-delay: 0.15s; }
      .bar:nth-child(3) { animation-delay: 0.3s; }
      .bar:nth-child(4) { animation-delay: 0.45s; }
      .bar:nth-child(5) { animation-delay: 0.6s; }
      @keyframes barPulse {
        0%, 100% { transform: scaleY(0.3); opacity: 0.4; }
        50% { transform: scaleY(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="loader-container">
      <div class="logo">VELOCE<span>.</span></div>
      <div class="bars-loader">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <div class="tagline">Engineered for Distinction</div>
    </div>
    <script>
      // When running in Capacitor native shell, bridge to host or current location
      if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
        if (window.location.pathname === '/index.html' || window.location.pathname === '/') {
          // Native bridge initialized
        }
      }
    </script>
  </body>
</html>
