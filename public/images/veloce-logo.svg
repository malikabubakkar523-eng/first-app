<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" fill="none">
  <defs>
    <linearGradient id="sole-accent-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <filter id="veloce-glow-d" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Left Sole Tread Icon -->
  <g transform="translate(32, 35) scale(0.62) rotate(-35) translate(-40, -48)">
    <!-- Perimeter Contour -->
    <path 
      d="M20,70 C16,56 18,36 28,20 C34,10 44,4 54,6 C62,8 68,16 68,28 C68,44 60,56 58,68 C56,80 50,92 38,92 C26,92 20,82 20,70 Z" 
      stroke="#FFFFFF" 
      stroke-width="5.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Heel Loop -->
    <path 
      d="M24,70 C24,78 30,84 38,84 C46,84 50,78 50,70 C50,64 45,60 40,56 C35,52 32,48 30,42 C28,34 32,22 40,16 C45,12 50,14 54,18" 
      stroke="#FFFFFF" 
      stroke-width="4.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Flex Grooves & Chevron Traction -->
    <path 
      d="M32,24 L58,28 M30,36 L56,42 M28,48 L50,56 M36,66 L50,72 M34,78 L46,82" 
      stroke="#FFFFFF" 
      stroke-width="4" 
      stroke-linecap="round"
    />
    <!-- Inner Propulsion Core -->
    <path 
      d="M44,20 L38,50 L46,74" 
      stroke="url(#sole-accent-dark)" 
      stroke-width="4.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>

  <!-- VELOCE Wordmark -->
  <text 
    x="72" 
    y="49" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Montserrat', 'Helvetica Neue', 'Arial Black', sans-serif" 
    font-size="40" 
    font-weight="900" 
    letter-spacing="0.12em"
    fill="#FFFFFF" 
    filter="url(#veloce-glow-d)"
  >
    VELOCE
  </text>

  <!-- Dot Accent -->
  <circle cx="308" cy="46" r="4.5" fill="#f43f5e" />
</svg>
